info:
  name: List Tasks
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/tasks"
  params:
    - name: completed
      value: "false"
      type: query
      description: "Optional: true or false"
      disabled: true
    - name: important
      value: "true"
      type: query
      description: "Optional: true or false"
      disabled: true
    - name: categoryId
      value: "{{categoryId}}"
      type: query
      description: Optional category filter
      disabled: true
    - name: q
      value: meeting
      type: query
      description: Optional title/description search
      disabled: true
    - name: sort
      value: createdAt
      type: query
      description: "Optional: createdAt, dueDate, title"
      disabled: true
    - name: order
      value: desc
      type: query
      description: "Optional: asc or desc"
      disabled: true
    - name: page
      value: "1"
      type: query
      description: Optional page number
      disabled: true
    - name: limit
      value: "20"
      type: query
      description: Optional page size
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 OK
    request:
      url: "{{baseUrl}}/tasks"
      method: GET
      params:
        - name: completed
          value: "false"
          type: query
          description: "Optional: true or false"
          disabled: true
        - name: important
          value: "true"
          type: query
          description: "Optional: true or false"
          disabled: true
        - name: categoryId
          value: "{{categoryId}}"
          type: query
          description: Optional category filter
          disabled: true
        - name: q
          value: meeting
          type: query
          description: Optional title/description search
          disabled: true
        - name: sort
          value: createdAt
          type: query
          description: "Optional: createdAt, dueDate, title"
          disabled: true
        - name: order
          value: desc
          type: query
          description: "Optional: asc or desc"
          disabled: true
        - name: page
          value: "1"
          type: query
          description: Optional page number
          disabled: true
        - name: limit
          value: "20"
          type: query
          description: Optional page size
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": 101,
                "title": "Prepare Monday standup slides",
                "description": "Cover sprint progress and blockers",
                "dueDate": "2026-09-25",
                "isCompleted": false,
                "isImportant": true,
                "completedAt": null,
                "category": {
                  "id": 3,
                  "name": "Work"
                },
                "createdAt": "2026-09-23T08:00:00.000Z",
                "updatedAt": "2026-09-23T08:00:00.000Z"
              }
            ],
            "pagination": {
              "page": 1,
              "limit": 20,
              "total": 1,
              "totalPages": 1
            }
          }
  - name: 401 Unauthorized
    request:
      url: "{{baseUrl}}/tasks"
      method: GET
      params:
        - name: completed
          value: "false"
          type: query
          description: "Optional: true or false"
          disabled: true
        - name: important
          value: "true"
          type: query
          description: "Optional: true or false"
          disabled: true
        - name: categoryId
          value: "{{categoryId}}"
          type: query
          description: Optional category filter
          disabled: true
        - name: q
          value: meeting
          type: query
          description: Optional title/description search
          disabled: true
        - name: sort
          value: createdAt
          type: query
          description: "Optional: createdAt, dueDate, title"
          disabled: true
        - name: order
          value: desc
          type: query
          description: "Optional: asc or desc"
          disabled: true
        - name: page
          value: "1"
          type: query
          description: Optional page number
          disabled: true
        - name: limit
          value: "20"
          type: query
          description: Optional page size
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "UNAUTHENTICATED",
            "message": "Authentication required."
          }

docs: List only the authenticated user's tasks. Supports optional filtering, search, sorting, and pagination through query parameters.
