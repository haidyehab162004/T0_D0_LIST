info:
  name: Forgot Password - Verify OTP
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/auth/verify-reset-otp"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "otp": "{{resetOtp}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "if (res.getStatus() === 200) {\r

        \  const data = res.getBody();\r

        \  if (data.resetToken) bru.setCollectionVar(\"resetToken\", data.resetToken);\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 OK - Reset token issued
    request:
      url: "{{baseUrl}}/auth/verify-reset-otp"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "email": "{{email}}",
            "otp": "{{resetOtp}}"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "resetToken": "reset_eyJhbGciOi...example",
            "expiresInSeconds": 600
          }
  - name: 400 Bad Request - Invalid or expired OTP
    request:
      url: "{{baseUrl}}/auth/verify-reset-otp"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "email": "{{email}}",
            "otp": "{{resetOtp}}"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "INVALID_OR_EXPIRED_OTP",
            "message": "The verification code is invalid or has expired."
          }
  - name: 429 Too Many Requests
    request:
      url: "{{baseUrl}}/auth/verify-reset-otp"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "email": "{{email}}",
            "otp": "{{resetOtp}}"
          }
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "OTP_ATTEMPTS_EXCEEDED",
            "message": "Too many verification attempts. Request a new code."
          }

docs: Verify the password-reset OTP. On success returns a short-lived, single-purpose reset token. This does not create a normal authenticated session.
