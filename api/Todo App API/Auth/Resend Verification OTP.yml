info:
  name: Resend Verification OTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/resend-verification-otp"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 OK
    request:
      url: "{{baseUrl}}/auth/resend-verification-otp"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "email": "{{email}}"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "If the account requires verification, a new code has been sent."
          }
  - name: 429 Too Many Requests
    request:
      url: "{{baseUrl}}/auth/resend-verification-otp"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "email": "{{email}}"
          }
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "RATE_LIMITED",
            "message": "Please wait before requesting another code."
          }

docs: Send a new email-verification OTP. The old OTP should be invalidated and resend requests should be rate-limited.
