info:
  name: Forgot Password - Reset Password
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "resetToken": "{{resetToken}}",
        "newPassword": "NewPassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 OK - Password reset
    request:
      url: "{{baseUrl}}/auth/reset-password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "resetToken": "{{resetToken}}",
            "newPassword": "NewPassword123!"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Password reset successfully."
          }
  - name: 400 Bad Request - Invalid/expired reset token
    request:
      url: "{{baseUrl}}/auth/reset-password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "resetToken": "{{resetToken}}",
            "newPassword": "NewPassword123!"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "INVALID_OR_EXPIRED_RESET_TOKEN",
            "message": "The reset token is invalid or has expired."
          }
  - name: 400 Bad Request - Password validation
    request:
      url: "{{baseUrl}}/auth/reset-password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "resetToken": "{{resetToken}}",
            "newPassword": "NewPassword123!"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "VALIDATION_ERROR",
            "message": "Invalid request.",
            "errors": {
              "newPassword": "Password does not meet the minimum requirements."
            }
          }

docs: Set a new password using the short-lived reset token returned by /auth/verify-reset-otp. The reset token becomes invalid after successful use.
