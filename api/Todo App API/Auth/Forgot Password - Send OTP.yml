info:
  name: Forgot Password - Send OTP
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 OK - Generic response
    request:
      url: "{{baseUrl}}/auth/forgot-password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "email": "{{email}}"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "If an account exists for this email, a verification code has been sent."
          }
  - name: 429 Too Many Requests
    request:
      url: "{{baseUrl}}/auth/forgot-password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "email": "{{email}}"
          }
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "RATE_LIMITED",
            "message": "Too many requests. Please try again later."
          }

docs: Request a password-reset OTP. The response is intentionally generic whether or not the email exists, to reduce account enumeration.
