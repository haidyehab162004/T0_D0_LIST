info:
  name: Get Current User
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/auth/me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 OK
    request:
      url: "{{baseUrl}}/auth/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "user": {
              "id": 15,
              "name": "Yasser",
              "email": "yasser@example.com",
              "emailVerified": true
            }
          }
  - name: 401 Unauthorized
    request:
      url: "{{baseUrl}}/auth/me"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "UNAUTHENTICATED",
            "message": "Authentication required."
          }

docs: Return the currently authenticated user from the server-side session cookie.
